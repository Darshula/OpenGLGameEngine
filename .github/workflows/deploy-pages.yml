name: Deploy WebGL to GitHub Pages

on:
  workflow_run:
    workflows: ['Release packages']
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download the WebGL package from the completed build
        uses: actions/download-artifact@v4
        with:
          name: package-webgl
          path: package
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Extract website
        run: |
          mkdir -p site
          unzip -q 'package/LearningOpenGL-*-webgl.zip' -d site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
