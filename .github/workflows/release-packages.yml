name: Release packages

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

jobs:
  build:
    if: github.event.created == true
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            extension: tar.gz
          - platform: windows-x64-mingw
            os: ubuntu-24.04
            extension: zip
          - platform: windows-x64-msvc
            os: windows-2022
            extension: zip
          - platform: webgl
            os: ubuntu-24.04
            extension: zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: lukka/get-cmake@v3.31.5
      - name: Install Linux graphics dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Install MinGW cross-compiler
        if: matrix.platform == 'windows-x64-mingw'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Set up Emscripten
        if: matrix.platform == 'webgl'
        uses: mymindstorm/setup-emsdk@v15
      - name: Configure
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cmake --preset "$PLATFORM"
      - name: Build
        env:
          PLATFORM: ${{ matrix.platform }}
        run: cmake --build --preset "$PLATFORM-release" --parallel
      - name: Package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p packages
          cpack --preset "$PLATFORM-release" -B "$PWD/packages"
      - name: Upload package for release
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: packages/LearningOpenGL-*-${{ matrix.platform }}.${{ matrix.extension }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: Publish prerelease for this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" packages/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Automated build of commit ${GITHUB_SHA}."
